    <script>
        // 
        //let data
          // ================================
        // Google Sheets Configuration
        // ================================
        const GOOGLE_SHEETS_CONFIG = {
            // ใส่ URL ของ Web App ที่ Deploy จาก Google Apps Script
            WEB_APP_URL: 'https://script.google.com/macros/s/AKfycby5LrHFAylPL7lC5Xrq_ZYWGoV7JvdN6lafuEc_3zgX887S0dkB35TJYBoFr4dWF3hcFA/exec',
            
            // ตัวเลือกการใช้งาน
            USE_GOOGLE_SHEETS: true,  // true = ดึงข้อมูลจาก Google Sheets, false = ใช้ข้อมูล mock
            AUTO_SAVE: true,          // บันทึกอัตโนมัติเมื่อแก้ไข
            AUTO_REFRESH: true,       // รีเฟรชข้อมูลอัตโนมัติ
            REFRESH_INTERVAL: 5       // รีเฟรชทุก 5 นาที
        };

        // ================================
        // Global Variables
        // ================================
        let data = [];
     
        let autoRefreshInterval = null;
        let lastSyncTime = null;

        // ================================
        // Google Sheets API Functions
        // ================================

        /**
         * โหลดข้อมูลจาก Google Sheets
         */
        async function loadDataFromGoogleSheets() {
            if (!GOOGLE_SHEETS_CONFIG.USE_GOOGLE_SHEETS) {
                console.log('Google Sheets integration is disabled');
                return null;
            }
            
            try {
                showLoadingIndicator('กำลังโหลดข้อมูลจาก Google Sheets...');
                
                const response = await fetch(
                    `${GOOGLE_SHEETS_CONFIG.WEB_APP_URL}?action=getAllTasks&timestamp=${Date.now()}`,
                    {
                        method: 'GET',
                        mode: 'cors',
                        cache: 'no-cache'
                    }
                );
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                hideLoadingIndicator();
                
                if (result.success) {
                    console.log(`✓ โหลดข้อมูลสำเร็จ: ${result.data?.length || 0} รายการ`);
                    lastSyncTime = new Date();
                    
                    // แปลงข้อมูลเป็นรูปแบบที่เว็บแอปใช้งาน
                    return transformGoogleSheetsData(result.data);
                } else {
                    throw new Error(result.message || 'Unknown error');
                }
            } catch (error) {
                console.error('เกิดข้อผิดพลาดในการโหลดข้อมูล:', error);
                hideLoadingIndicator();
                showErrorMessage('ไม่สามารถโหลดข้อมูลจาก Google Sheets ได้: ' + error.message);
                return null;
            }
        }

        /**
         * แปลงข้อมูลจาก Google Sheets เป็นรูปแบบที่เว็บแอปใช้
         */
        function transformGoogleSheetsData(sheetsData) {
            if (!sheetsData || !Array.isArray(sheetsData)) {
                return [];
            }
            
            return sheetsData.map(row => ({
                id: row['ID'] || row['taskId'] || '',
                department: row['ฝ่าย'] || row['department'] || '',
                division: row['กอง'] || row['division'] || '',
                month: row['Start month'] || row['month'] || '',
                year: row['YEAR'] || row['year'] || '',
                week: row['Start WeeK'] || row['week'] || '',
                duration: row['Duration week'] || row['duration'] || '',
                process: row['Process ชื่อกระบวนการทำงาน'] || row['process'] || '',
                category: row['หมวดงาน'] || row['category'] || '',
                inputOwner: row['หน่วยงานเจ้าของ Input'] || row['inputOwner'] || '',
                hasExternalInput: row['หน่วยงานเจ้าของ Input มีหน่วยงานภายนอกหรือไม่'] || row['hasExternalInput'] || '',
                inputName: row['ชื่อ  Input'] || row['inputName'] || '',
                task: row['Task กิจกรรม ทำอะไร'] || row['task'] || '',
                outputName: row['ชื่อ Output'] || row['outputName'] || '',
                outputReceiver: row['หน่วยงานที่รับ Output'] || row['outputReceiver'] || '',
                hasExternalOutput: row['หน่วยงานที่รับ Output มีหน่วยงานภายนอกหรือไม่'] || row['hasExternalOutput'] || '',
                
                // ข้อมูลสถานะและความคืบหน้า
                status: row['สถานะ'] || row['status'] || 'not_started',
                progress: parseInt(row['%ความก้าวหน้า'] || row['progress']) || 0,
                actualStartDate: row['วันที่เริ่มจริง'] || row['actualStartDate'] || null,
                actualEndDate: row['วันที่เสร็จจริง'] || row['actualEndDate'] || null,
                responsible: row['ผู้รับผิดชอบ'] || row['responsible'] || '',
                notes: row['หมายเหตุปัจจุบัน'] || row['notes'] || '',
                lastUpdate: row['วันที่อัพเดตล่าสุด'] || row['lastUpdate'] || null,
                updater: row['ผู้อัพเดต'] || row['updater'] || ''
            }));
        }

        /**
         * บันทึกความคืบหน้าไปยัง Google Sheets
         */
        async function saveProgressToGoogleSheets(taskId, progressData) {
            if (!GOOGLE_SHEETS_CONFIG.USE_GOOGLE_SHEETS) {
                console.log('Google Sheets integration is disabled');
                return true;
            }
            
            try {
                showLoadingIndicator('กำลังบันทึกข้อมูล...');
                
                const response = await fetch(GOOGLE_SHEETS_CONFIG.WEB_APP_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'updateProgress',
                        taskId: taskId,
                        status: progressData.status,
                        progress: progressData.progress,
                        actualStartDate: progressData.actualStartDate,
                        actualEndDate: progressData.actualEndDate,
                        notes: progressData.notes,
                        updatedBy: progressData.updater || 'Web App User',
                        timestamp: new Date().toISOString()
                    })
                });
                
                const result = await response.json();
                
                hideLoadingIndicator();
                
                if (result.success) {
                    console.log('✓ บันทึกข้อมูลสำเร็จ');
                    showSuccessMessage('บันทึกข้อมูลสำเร็จ');
                    lastSyncTime = new Date();
                    return true;
                } else {
                    throw new Error(result.message || 'Unknown error');
                }
            } catch (error) {
                console.error('เกิดข้อผิดพลาดในการบันทึกข้อมูล:', error);
                hideLoadingIndicator();
                showErrorMessage('ไม่สามารถบันทึกข้อมูลได้: ' + error.message);
                return false;
            }
        }

        /**
         * รีเฟรชข้อมูลแบบ Manual
         */
        async function manualRefresh() {
            const newData = await loadDataFromGoogleSheets();
            if (newData) {
                data = newData;
                render();
                showSuccessMessage('รีเฟรชข้อมูลสำเร็จ');
            }
        }

        /**
         * เริ่ม Auto-refresh
         */
        function startAutoRefresh() {
            if (!GOOGLE_SHEETS_CONFIG.AUTO_REFRESH) return;
            
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
            
            autoRefreshInterval = setInterval(async () => {
                console.log('Auto-refreshing data...');
                const newData = await loadDataFromGoogleSheets();
                if (newData) {
                    data = newData;
                    render();
                }
            }, GOOGLE_SHEETS_CONFIG.REFRESH_INTERVAL * 60 * 1000);
            
            console.log(`✓ Auto-refresh enabled (every ${GOOGLE_SHEETS_CONFIG.REFRESH_INTERVAL} minutes)`);
        }

        /**
         * หยุด Auto-refresh
         */
        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
                console.log('✓ Auto-refresh disabled');
            }
        }

        // ================================
        // UI Helper Functions
        // ================================

        /**
         * แสดง Loading Indicator
         */
        function showLoadingIndicator(message = 'กำลังโหลด...') {
            const existingIndicator = document.getElementById('loading-indicator');
            if (existingIndicator) {
                existingIndicator.remove();
            }
            
            const indicator = document.createElement('div');
            indicator.id = 'loading-indicator';
            indicator.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
            indicator.innerHTML = `
                <div class="bg-white rounded-lg p-6 shadow-xl max-w-sm">
                    <div class="flex items-center space-x-4">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                        <span class="text-gray-700 font-semibold">${message}</span>
                    </div>
                </div>
            `;
            document.body.appendChild(indicator);
        }

        /**
         * ซ่อน Loading Indicator
         */
        function hideLoadingIndicator() {
            const indicator = document.getElementById('loading-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        /**
         * แสดงข้อความสำเร็จ
         */
        function showSuccessMessage(message) {
            showToast(message, 'success');
        }

        /**
         * แสดงข้อความผิดพลาด
         */
        function showErrorMessage(message) {
            showToast(message, 'error');
        }

        /**
         * แสดง Toast Notification
         */
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg z-50 animate-fade-in ${
                type === 'success' ? 'bg-green-500' :
                type === 'error' ? 'bg-red-500' :
                'bg-blue-500'
            } text-white font-semibold`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        /**
         * ฟอร์แมตวันที่และเวลาล่าสุดที่ sync
         */
        function getLastSyncTimeText() {
            if (!lastSyncTime) return '';
            
            const now = new Date();
            const diff = Math.floor((now - lastSyncTime) / 1000); // seconds
            
            if (diff < 60) return 'เมื่อสักครู่';
            if (diff < 3600) return `${Math.floor(diff / 60)} นาทีที่แล้ว`;
            if (diff < 86400) return `${Math.floor(diff / 3600)} ชั่วโมงที่แล้ว`;
            
            return lastSyncTime.toLocaleString('th-TH');
        }

        // ================================
        // Mock Data (Fallback)
        // ================================
        const mockData = [
            {
                id: 'TASK_0001',
                department: 'กทน.',
                division: 'กทน.1',
                month: 'OCT',
                year: '2025',
                week: '1',
                duration: '1',
                process: 'กระบวนการทดสอบ 1',
                category: 'การบริหารจัดการ',
                inputOwner: 'กทน.1',
                hasExternalInput: 'ไม่มี',
                inputName: 'ข้อมูลทดสอบ',
                task: 'ทดสอบระบบ',
                outputName: 'รายงานทดสอบ',
                outputReceiver: 'ผู้บริหาร',
                hasExternalOutput: 'ไม่มี',
                status: 'not_started',
                progress: 0,
                actualStartDate: null,
                actualEndDate: null,
                responsible: '',
                notes: '',
                lastUpdate: null,
                updater: ''
            }
        ];

        
        let view = 'table';
        let searchTerm = '';
        let filterProcess = 'all';
        let filterDivision = 'all';
        let filterDepartment = 'all';
        let filterMonth = 'all';
        let filterStatus = 'all';
        let progress = {};
        let editingTask = null;
        let reportFilter = 'all'; // สำหรับ filter ในหน้ารายงาน
        let urgentTasksPage = 1; // หน้าปัจจุบันของงานเร่งด่วน
        const urgentTasksPerPage = 10; // จำนวนรายการต่อหน้า
        let calendarFilter = 'all'; // filter สำหรับหน้าปฏิทิน: 'all', 'new', 'ongoing'

        const monthOrder = ['OCT', 'NOV', 'DEC', 'JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP'];
        const monthThai = {
            'OCT': 'ตุลาคม', 'NOV': 'พฤศจิกายน', 'DEC': 'ธันวาคม',
            'JAN': 'มกราคม', 'FEB': 'กุมภาพันธ์', 'MAR': 'มีนาคม',

            'JUL': 'กรกฎาคม', 'AUG': 'สิงหาคม', 'SEP': 'กันยายน'
        };
        
        // แปลงเลขเดือน (1-12) เป็นชื่อเดือน
        const monthNumToName = {
            1: 'JAN', 2: 'FEB', 3: 'MAR', 4: 'APR', 5: 'MAY', 6: 'JUN',
            7: 'JUL', 8: 'AUG', 9: 'SEP', 10: 'OCT', 11: 'NOV', 12: 'DEC'
        };

        // สีสำหรับแต่ละฝ่าย
        const departmentColors = {
            'ฝ่ายบริหารความเสี่ยง (ฝบส.)': {
                bg: 'bg-blue-500',
                bgLight: 'bg-blue-100',
                text: 'text-blue-800',
                border: 'border-blue-300',
                gradient: 'from-blue-500 to-blue-600'
            },
            'ฝ่ายนโยบายและยุทธศาสตร์ (ฝนย.)': {
                bg: 'bg-purple-500',
                bgLight: 'bg-purple-100',
                text: 'text-purple-800',
                border: 'border-purple-300',
                gradient: 'from-purple-500 to-purple-600'
            }
        };

        function getDepartmentColor(department, type = 'bg') {
            const colors = departmentColors[department];
            if (!colors) {
                return type === 'bg' ? 'bg-gray-500' : 
                       type === 'bgLight' ? 'bg-gray-100' :
                       type === 'text' ? 'text-gray-800' :
                       type === 'border' ? 'border-gray-300' :
                       'from-gray-500 to-gray-600';
            }
            return colors[type];
        }

        function truncateText(text, maxLength = 50) {
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength - 3) + '...';
        }

        function getMonthIndex(month) {
            return monthOrder.indexOf(month.toUpperCase());
        }

        function calculateActualDates(monthNum, year, week, duration) {
            // monthNum คือเดือน 1-12, year คือปี ค.ศ., duration เป็นสัปดาห์ (รองรับทศนิยม)
            // แปลงเป็น JavaScript Date (month เป็น 0-indexed)
            const firstDay = new Date(year, monthNum - 1, 1);
            
            // หาวันจันทร์แรกของเดือน (0=Sunday, 1=Monday, ..., 6=Saturday)
            const firstDayOfWeek = firstDay.getDay();
            let daysUntilMonday;
            
            if (firstDayOfWeek === 1) {
                // วันแรกเป็นวันจันทร์
                daysUntilMonday = 0;
            } else if (firstDayOfWeek === 0) {
                // วันแรกเป็นวันอาทิตย์ -> จันทร์ถัดไปคือวันที่ 2
                daysUntilMonday = 1;
            } else {
                // วันอื่นๆ
                daysUntilMonday = 8 - firstDayOfWeek;
            }
            
            const firstMonday = new Date(year, monthNum - 1, 1 + daysUntilMonday);
            
            // คำนวณวันเริ่มต้นตาม week
            const startDate = new Date(firstMonday);
            startDate.setDate(firstMonday.getDate() + (parseInt(week) - 1) * 7);
            
            // คำนวณวันสิ้นสุด - รองรับทศนิยม (แปลงเป็นวัน)
            const endDate = new Date(startDate);
            const durationDays = Math.max(1, Math.round(parseFloat(duration) * 7)); // อย่างน้อย 1 วัน
            endDate.setDate(startDate.getDate() + durationDays - 1);
            
            return { startDate, endDate };
        }

        function formatDate(date) {
            return date.toLocaleDateString('th-TH', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }

        function getTaskStatus(taskId, startDate, endDate) {
            const taskProgress = progress[taskId] || { status: 'not_started', progress: 0 };
            const today = new Date();
            today.setHours(0, 0, 0, 0); // Reset เวลาเป็น 00:00:00 สำหรับเปรียบเทียบวันที่
            
            const start = new Date(startDate);
            start.setHours(0, 0, 0, 0);
            
            const end = new Date(endDate);
            end.setHours(0, 0, 0, 0);
            
            // ถ้าเสร็จแล้ว
            if (taskProgress.status === 'completed' || taskProgress.progress >= 100) return 'completed';
            
            // ถ้ายังไม่เริ่มและยังไม่ถึงวันเริ่ม
            if (today < start && taskProgress.status === 'not_started') return 'not_started';
            
            // ถ้าเลยวันสิ้นสุดแล้วและยังไม่เสร็จ (งานต้องเริ่มแล้ว)
            if (today > end && taskProgress.status !== 'completed' && taskProgress.progress < 100) {
                return 'overdue';
            }
            
            // ถ้าเริ่มช้ากว่ากำหนด
            if (taskProgress.actualStartDate && new Date(taskProgress.actualStartDate) > start) {
                return 'delayed';
            }
            
            // ถ้ากำลังดำเนินการ
            if (taskProgress.status === 'in_progress' && taskProgress.progress > 0) {
                return 'in_progress';
            }
            
            // ถ้าอยู่ในช่วงเวลาที่ต้องทำและเริ่มแล้ว
            if (today >= start && today <= end) {
                return 'on_track';
            }
            
            return 'not_started';
        }

        function getStatusColor(status) {
            switch (status) {
                case 'completed': return 'bg-green-500';
                case 'in_progress': return 'bg-blue-500';
                case 'on_track': return 'bg-blue-500';
                case 'delayed': return 'bg-orange-500';
                case 'overdue': return 'bg-red-500';
                default: return 'bg-gray-400';
            }
        }

        function getStatusText(status) {
            switch (status) {
                case 'completed': return 'เสร็จสิ้น';
                case 'in_progress': return 'กำลังดำเนินการ';
                case 'on_track': return 'ตามแผน';
                case 'delayed': return 'ล่าช้า';
                case 'overdue': return 'เกินกำหนด';
                default: return 'ยังไม่เริ่ม';
            }
        }

        function getFilteredData() {
            return data.filter(item => {
                const taskId = `${item.id}`;
                
                const { startDate, endDate } = calculateActualDates(
                    item.month,
                    item.year,
                    item.startWeek,
                    item.durationWeeks
                );
                const status = getTaskStatus(taskId, startDate, endDate);

                // แปลงเดือนเป็น string สำหรับเปรียบเทียบ filter
                const monthName = monthNumToName[item.month] || '';

                const matchSearch = searchTerm === '' || 
                    Object.values(item).some(val => 
                        String(val).toLowerCase().includes(searchTerm.toLowerCase())
                    );
                const matchDepartment = filterDepartment === 'all' || item.department === filterDepartment;
                const matchProcess = filterProcess === 'all' || item.process === filterProcess;
                const matchDivision = filterDivision === 'all' || item.division === filterDivision;
                const matchMonth = filterMonth === 'all' || monthName === filterMonth;
                const matchStatus = filterStatus === 'all' || status === filterStatus;
                
                return matchSearch && matchDepartment && matchProcess && matchDivision && matchMonth && matchStatus;
            }).sort((a, b) => {
                // เรียงตามปีแล้วเดือน
                if (a.year !== b.year) return a.year - b.year;
                if (a.month !== b.month) return a.month - b.month;
                return a.startWeek - b.startWeek;
            });
        }

        function getUniqueDepartments() {
            return [...new Set(data.map(item => item.department))].sort();
        }

        function getUniqueProcesses() {
            return [...new Set(data.map(item => item.process))].sort();
        }

        function getUniqueDivisions() {
            return [...new Set(data.map(item => item.division))].sort();
        }

        function getUniqueMonths() {
            const months = [...new Set(data.map(item => monthNumToName[item.month]))];
            return months.filter(m => m).sort((a, b) => getMonthIndex(a) - getMonthIndex(b));
        }

            if (!editingTask) return;
            
            const form = document.getElementById('progressForm');
            const formData = new FormData(form);
            
            progress[editingTask.taskId] = {
                status: formData.get('status'),

        function renderTimelineView(filteredData) {
            const allDates = filteredData.flatMap(item => {
                const { startDate, endDate } = calculateActualDates(item.month, item.year, item.startWeek, item.durationWeeks);
                return [startDate, endDate];
            });
            
            const minDate = new Date(Math.min(...allDates));
            const maxDate = new Date(Math.max(...allDates));
            const totalDays = Math.floor((maxDate - minDate) / (1000 * 60 * 60 * 24));

            // สร้างเดือนสำหรับ header
            const months = [];
            let currentDate = new Date(minDate);
            currentDate.setDate(1);
            
            while (currentDate <= maxDate) {
                const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
                const monthStart = new Date(currentDate);
                const monthEnd = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
                
                const visibleDays = monthEnd > maxDate 
                    ? Math.floor((maxDate - monthStart) / (1000 * 60 * 60 * 24)) + 1
                    : daysInMonth;
                
                const widthPercent = (visibleDays / totalDays) * 100;
                
                months.push({
                    month: currentDate.getMonth(),
                    year: currentDate.getFullYear(),
                    widthPercent
                });
                
                currentDate.setMonth(currentDate.getMonth() + 1);
            }

            const thaiMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

            return `
                <div class="bg-white rounded-lg shadow p-4 overflow-x-auto">
                    <div class="min-w-[1200px]">
                        <!-- Timeline Header -->
                        <div class="flex border-b-2 border-gray-300 mb-4">
                            <div class="w-72 flex-shrink-0 font-semibold text-gray-700 py-2 pr-4">งาน</div>
                            <div class="flex-1 flex">
                                ${months.map((m, idx) => `
                                    <div 
                                        class="border-l border-gray-200 text-center py-2 text-xs font-semibold text-gray-600"
                                        style="width: ${m.widthPercent}%"
                                    >
                                        ${thaiMonths[m.month]} ${m.year + 543}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Timeline Bars -->
                        <div class="space-y-2">
                            ${filteredData.map((item) => {
                                const taskId = `${item.id}`;
                                const { startDate, endDate } = calculateActualDates(item.month, item.year, item.startWeek, item.durationWeeks);
                                const status = getTaskStatus(taskId, startDate, endDate);
                                const statusColor = getStatusColor(status);
                                
                                const leftPercent = ((startDate - minDate) / (1000 * 60 * 60 * 24) / totalDays) * 100;
                                const widthPercent = ((endDate - startDate) / (1000 * 60 * 60 * 24) / totalDays) * 100;
                                
                                return `
                                    <div class="flex items-center">
                                        <div class="w-72 flex-shrink-0 pr-4 text-sm text-gray-700 truncate" title="${item.category}">
                                            ${item.category}
                                        </div>
                                        <div class="flex-1 relative h-8">
                                            <div 
                                                class="timeline-bar absolute h-6 ${statusColor} rounded cursor-pointer"
                                                style="left: ${leftPercent}%; width: ${Math.max(widthPercent, 0.5)}%; min-width: 4px;"
                                                onclick='openProgressModal(${JSON.stringify(item).replace(/'/g, "&#39;")}, "${taskId}")'
                                                title="${item.category}\n${formatDate(startDate)} - ${formatDate(endDate)}\nระยะเวลา: ${item.durationWeeks} สัปดาห์\nสถานะ: ${getStatusText(status)}"
                                            >
                                                <span class="text-white text-xs px-2 truncate block leading-6">
                                                    ${item.durationWeeks}w
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCalendarView(filteredData) {
            // จัดกลุ่มงานตามเดือนที่เริ่มต้น
            const tasksByMonth = {};
            
            filteredData.forEach(item => {
                const { startDate, endDate } = calculateActualDates(
                    item.month,
                    item.year,
                    item.startWeek,
                    item.durationWeeks
                );
                
                // วนลูปทุกเดือนที่งานนี้ครอบคลุม
                const startMonth = startDate.getMonth(); // 0-11
                const startYear = startDate.getFullYear();
                const endMonth = endDate.getMonth();
                const endYear = endDate.getFullYear();
                
                let currentDate = new Date(startYear, startMonth, 1);
                const lastDate = new Date(endYear, endMonth, 1);
                
                while (currentDate <= lastDate) {
                    const monthNum = currentDate.getMonth() + 1; // 1-12
                    const monthName = monthNumToName[monthNum];
                    
                    if (!tasksByMonth[monthName]) {
                        tasksByMonth[monthName] = [];
                    }
                    
                    // ตรวจสอบว่างานเริ่มในเดือนนี้หรือไม่
                    const isNewTask = (startDate.getMonth() === currentDate.getMonth() && 
                                      startDate.getFullYear() === currentDate.getFullYear());
                    
                    // เพิ่มข้อมูลประเภทงาน
                    const taskWithType = {
                        ...item,
                        taskType: isNewTask ? 'new' : 'ongoing'
                    };
                    
                    tasksByMonth[monthName].push(taskWithType);
                    
                    // ไปเดือนถัดไป
                    currentDate.setMonth(currentDate.getMonth() + 1);
                }
            });

            const uniqueMonths = getUniqueMonths();

            return `

                                <span class="text-sm text-gray-600">งานใหม่</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="px-2 py-1 bg-gray-200 text-gray-700 text-xs font-semibold rounded">Cont</span>
                                <span class="text-sm text-gray-600">งานต่อเนื่อง</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${uniqueMonths.map(month => {
                        let tasksInMonth = tasksByMonth[month] || [];
                        
                        // กรองงานตาม calendarFilter
                        if (calendarFilter === 'new') {
                            tasksInMonth = tasksInMonth.filter(t => t.taskType === 'new');
                        } else if (calendarFilter === 'ongoing') {
                            tasksInMonth = tasksInMonth.filter(t => t.taskType === 'ongoing');
                        }
                        
                        const newTasksCount = (tasksByMonth[month] || []).filter(t => t.taskType === 'new').length;
                        const ongoingTasksCount = (tasksByMonth[month] || []).filter(t => t.taskType === 'ongoing').length;
                        
                        return `
                        <div class="bg-white rounded-lg shadow-lg border border-gray-200 overflow-hidden">
                            <div class="bg-gradient-to-r from-blue-600 to-blue-700 text-white px-4 py-3">
                                <h3 class="text-lg font-bold">${monthThai[month]}</h3>
                                <p class="text-xs text-blue-100">
                                    ${calendarFilter === 'all' ? `${tasksInMonth.length} งาน (${newTasksCount} ใหม่, ${ongoingTasksCount} ต่อเนื่อง)` : 
                                      calendarFilter === 'new' ? `${tasksInMonth.length} งานใหม่` :

                            <div class="p-4 space-y-3 max-h-96 overflow-y-auto">

                                        <svg class="w-12 h-12 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
                                        </svg>
                                        <p class="text-sm">ไม่มีงานในเดือนนี้</p>
                                    </div>
                                ` : tasksInMonth.map(item => renderTaskCard(item, item.taskType)).join('')}
                            </div>
                        </div>
                    `;
                }).join('')}
                </div>
            `;
        }

        function renderReportView(filteredData) {
            // คำนวณสถิติ
            const stats = {
                total: data.length,
                notStarted: 0,
                inProgress: 0,
                onTrack: 0,
                delayed: 0,
                overdue: 0,
                completed: 0,
                totalProgress: 0
            };

            const departmentStats = {};
            const monthStats = {};
            const urgentTasksMap = new Map(); // ใช้ Map เพื่อป้องกันงานซ้ำ

            data.forEach(item => {
                const taskId = `${item.id}`;
                const monthName = monthNumToName[item.month];
                const { startDate, endDate } = calculateActualDates(item.month, item.year, item.startWeek, item.durationWeeks);
                const status = getTaskStatus(taskId, startDate, endDate);
                const taskProgress = progress[taskId] || { progress: 0 };

                // นับสถานะ
                stats[status] = (stats[status] || 0) + 1;
                stats.totalProgress += taskProgress.progress;

                // สถิติตามฝ่าย
                if (!departmentStats[item.department]) {
                    departmentStats[item.department] = {
                        total: 0,
                        completed: 0,
                        inProgress: 0,
                        delayed: 0,
                        overdue: 0,
                        totalProgress: 0
                    };
                }
                departmentStats[item.department].total++;
                departmentStats[item.department][status] = (departmentStats[item.department][status] || 0) + 1;
                departmentStats[item.department].totalProgress += taskProgress.progress;

                // สถิติตามเดือน
                if (!monthStats[monthName]) {
                    monthStats[monthName] = { total: 0, completed: 0 };

                ${renderProgressModal()}
            `;
        }

        render();
    </script>
</body>
