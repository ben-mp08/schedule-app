        function calculateActualDates(monthNum, year, week, duration) {
            // monthNum คือเดือน 1-12, year คือปี ค.ศ., duration เป็นสัปดาห์ (รองรับทศนิยม)
            // แปลงเป็น JavaScript Date (month เป็น 0-indexed)
            const firstDay = new Date(year, monthNum - 1, 1);
            
            // หาวันจันทร์แรกของเดือน (0=Sunday, 1=Monday, ..., 6=Saturday)
            const firstDayOfWeek = firstDay.getDay();
            let daysUntilMonday;
            
            if (firstDayOfWeek === 1) {
                // วันแรกเป็นวันจันทร์
                daysUntilMonday = 0;
            } else if (firstDayOfWeek === 0) {
                // วันแรกเป็นวันอาทิตย์ -> จันทร์ถัดไปคือวันที่ 2
                daysUntilMonday = 1;
            } else {
                // วันอื่นๆ
                daysUntilMonday = 8 - firstDayOfWeek;
            }
            
            const firstMonday = new Date(year, monthNum - 1, 1 + daysUntilMonday);
            
            // คำนวณวันเริ่มต้นตาม week
            const startDate = new Date(firstMonday);
            startDate.setDate(firstMonday.getDate() + (parseInt(week) - 1) * 7);
            
            // คำนวณวันสิ้นสุด - รองรับทศนิยม (แปลงเป็นวัน)
            const endDate = new Date(startDate);
            const durationDays = Math.max(1, Math.round(parseFloat(duration) * 7)); // อย่างน้อย 1 วัน
            endDate.setDate(startDate.getDate() + durationDays - 1);
            
            return { startDate, endDate };
        }

            const end = new Date(endDate);

            // ถ้าเสร็จแล้ว

            // ถ้ายังไม่เริ่มและยังไม่ถึงวันเริ่ม
            if (today < start && taskProgress.status === 'not_started') return 'not_started';
            
            // ถ้าเลยวันสิ้นสุดแล้วและยังไม่เสร็จ (งานต้องเริ่มแล้ว)
            if (today > end && taskProgress.status !== 'completed' && taskProgress.progress < 100) {
                return 'overdue';
            }
            
            // ถ้าเริ่มช้ากว่ากำหนด
            if (taskProgress.actualStartDate && new Date(taskProgress.actualStartDate) > start) {

            // ถ้ากำลังดำเนินการ

                return 'in_progress';
            }
            
            // ถ้าอยู่ในช่วงเวลาที่ต้องทำและเริ่มแล้ว
            if (today >= start && today <= end) {
                return 'on_track';
            }
            
            return 'not_started';
        }

                    item.year,
                    item.startWeek,
                    item.durationWeeks
                );
                const status = getTaskStatus(taskId, startDate, endDate);

                // แปลงเดือนเป็น string สำหรับเปรียบเทียบ filter
                const monthName = monthNumToName[item.month] || '';

                const matchSearch = searchTerm === '' || 
                    Object.values(item).some(val => 
                        String(val).toLowerCase().includes(searchTerm.toLowerCase())
                    );
                const matchDepartment = filterDepartment === 'all' || item.department === filterDepartment;
                const matchProcess = filterProcess === 'all' || item.process === filterProcess;
                const matchDivision = filterDivision === 'all' || item.division === filterDivision;
                const matchMonth = filterMonth === 'all' || monthName === filterMonth;
                const matchStatus = filterStatus === 'all' || status === filterStatus;
                
                return matchSearch && matchDepartment && matchProcess && matchDivision && matchMonth && matchStatus;
            }).sort((a, b) => {
                // เรียงตามปีแล้วเดือน
                if (a.year !== b.year) return a.year - b.year;
                if (a.month !== b.month) return a.month - b.month;
                return a.startWeek - b.startWeek;
            });
        }

        function getUniqueDepartments() {
            return [...new Set(data.map(item => item.department))].sort();
        }

        function getUniqueProcesses() {
            return [...new Set(data.map(item => item.process))].sort();
        }

        function getUniqueDivisions() {
            return [...new Set(data.map(item => item.division))].sort();
        }

        function getUniqueMonths() {
            const months = [...new Set(data.map(item => monthNumToName[item.month]))];
            return months.filter(m => m).sort((a, b) => getMonthIndex(a) - getMonthIndex(b));
        }

                actualStartDate: formData.get('actualStartDate') || null,
                actualEndDate: formData.get('actualEndDate') || null,
                notes: formData.get('notes') || ''
            };
            
            closeProgressModal();

        function renderTimelineView(filteredData) {
            const allDates = filteredData.flatMap(item => {
                const { startDate, endDate } = calculateActualDates(item.month, item.year, item.startWeek, item.durationWeeks);
                return [startDate, endDate];
            });
            
            const minDate = new Date(Math.min(...allDates));
            const maxDate = new Date(Math.max(...allDates));
            const totalDays = Math.floor((maxDate - minDate) / (1000 * 60 * 60 * 24));

            // สร้างเดือนสำหรับ header
            const months = [];
            let currentDate = new Date(minDate);
            currentDate.setDate(1);
            
            while (currentDate <= maxDate) {
                const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
                const monthStart = new Date(currentDate);
                const monthEnd = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0);
                
                const visibleDays = monthEnd > maxDate 
                    ? Math.floor((maxDate - monthStart) / (1000 * 60 * 60 * 24)) + 1
                    : daysInMonth;
                
                const widthPercent = (visibleDays / totalDays) * 100;
                
                months.push({
                    month: currentDate.getMonth(),
                    year: currentDate.getFullYear(),
                    widthPercent
                });
                
                currentDate.setMonth(currentDate.getMonth() + 1);
            }

            const thaiMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

            return `
                <div class="bg-white rounded-lg shadow p-4 overflow-x-auto">
                    <div class="min-w-[1200px]">
                        <!-- Timeline Header -->
                        <div class="flex border-b-2 border-gray-300 mb-4">
                            <div class="w-72 flex-shrink-0 font-semibold text-gray-700 py-2 pr-4">งาน</div>
                            <div class="flex-1 flex">
                                ${months.map((m, idx) => `
                                    <div 
                                        class="border-l border-gray-200 text-center py-2 text-xs font-semibold text-gray-600"
                                        style="width: ${m.widthPercent}%"
                                    >
                                        ${thaiMonths[m.month]} ${m.year + 543}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Timeline Bars -->
                        <div class="space-y-2">
                            ${filteredData.map((item) => {
                                const taskId = `${item.id}`;
                                const { startDate, endDate } = calculateActualDates(item.month, item.year, item.startWeek, item.durationWeeks);
                                const status = getTaskStatus(taskId, startDate, endDate);
                                const statusColor = getStatusColor(status);
                                
                                const leftPercent = ((startDate - minDate) / (1000 * 60 * 60 * 24) / totalDays) * 100;
                                const widthPercent = ((endDate - startDate) / (1000 * 60 * 60 * 24) / totalDays) * 100;
                                
                                return `
                                    <div class="flex items-center">
                                        <div class="w-72 flex-shrink-0 pr-4 text-sm text-gray-700 truncate" title="${item.category}">
                                            ${item.category}
                                        </div>
                                        <div class="flex-1 relative h-8">
                                            <div 
                                                class="timeline-bar absolute h-6 ${statusColor} rounded cursor-pointer"
                                                style="left: ${leftPercent}%; width: ${Math.max(widthPercent, 0.5)}%; min-width: 4px;"
                                                onclick='openProgressModal(${JSON.stringify(item).replace(/'/g, "&#39;")}, "${taskId}")'
                                                title="${item.category}\n${formatDate(startDate)} - ${formatDate(endDate)}\nระยะเวลา: ${item.durationWeeks} สัปดาห์\nสถานะ: ${getStatusText(status)}"
                                            >
                                                <span class="text-white text-xs px-2 truncate block leading-6">
                                                    ${item.durationWeeks}w
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCalendarView(filteredData) {
            // จัดกลุ่มงานตามเดือนที่เริ่มต้น
            const tasksByMonth = {};
            
            filteredData.forEach(item => {
                const { startDate, endDate } = calculateActualDates(
                    item.month,
                    item.year,
                    item.startWeek,
                    item.durationWeeks
                );
                
                // วนลูปทุกเดือนที่งานนี้ครอบคลุม
                const startMonth = startDate.getMonth(); // 0-11
                const startYear = startDate.getFullYear();
                const endMonth = endDate.getMonth();
                const endYear = endDate.getFullYear();
                
                let currentDate = new Date(startYear, startMonth, 1);
                const lastDate = new Date(endYear, endMonth, 1);
                
                while (currentDate <= lastDate) {
                    const monthNum = currentDate.getMonth() + 1; // 1-12
                    const monthName = monthNumToName[monthNum];
                    
                    if (!tasksByMonth[monthName]) {
                        tasksByMonth[monthName] = [];
                    }
                    
                    // ตรวจสอบว่างานเริ่มในเดือนนี้หรือไม่
                    const isNewTask = (startDate.getMonth() === currentDate.getMonth() && 
                                      startDate.getFullYear() === currentDate.getFullYear());
                    
                    // เพิ่มข้อมูลประเภทงาน
                    const taskWithType = {
                        ...item,
                        taskType: isNewTask ? 'new' : 'ongoing'
                    };
                    
                    tasksByMonth[monthName].push(taskWithType);
                    
                    // ไปเดือนถัดไป
                    currentDate.setMonth(currentDate.getMonth() + 1);
                }

            const uniqueMonths = getUniqueMonths();

                            <option value="ongoing" ${calendarFilter === 'ongoing' ? 'selected' : ''}>งานที่ดำเนินการต่อเนื่อง</option>
                        </select>
                        <div class="flex items-center gap-4 ml-auto">
                            <div class="flex items-center gap-2">
                                <span class="px-2 py-1 bg-green-100 text-green-700 text-xs font-semibold rounded">New</span>
                                <span class="text-sm text-gray-600">งานใหม่</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="px-2 py-1 bg-gray-200 text-gray-700 text-xs font-semibold rounded">Cont</span>
                                <span class="text-sm text-gray-600">งานต่อเนื่อง</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${uniqueMonths.map(month => {
                        let tasksInMonth = tasksByMonth[month] || [];
                        
                        // กรองงานตาม calendarFilter
                        if (calendarFilter === 'new') {
                            tasksInMonth = tasksInMonth.filter(t => t.taskType === 'new');
                        } else if (calendarFilter === 'ongoing') {
                            tasksInMonth = tasksInMonth.filter(t => t.taskType === 'ongoing');
                        }
                        
                        const newTasksCount = (tasksByMonth[month] || []).filter(t => t.taskType === 'new').length;
                        const ongoingTasksCount = (tasksByMonth[month] || []).filter(t => t.taskType === 'ongoing').length;
                        
                        return `
                        <div class="bg-white rounded-lg shadow-lg border border-gray-200 overflow-hidden">
                            <div class="bg-gradient-to-r from-blue-600 to-blue-700 text-white px-4 py-3">
                                <h3 class="text-lg font-bold">${monthThai[month]}</h3>
                                <p class="text-xs text-blue-100">
                                    ${calendarFilter === 'all' ? `${tasksInMonth.length} งาน (${newTasksCount} ใหม่, ${ongoingTasksCount} ต่อเนื่อง)` : 
                                      calendarFilter === 'new' ? `${tasksInMonth.length} งานใหม่` :
                                      `${tasksInMonth.length} งานต่อเนื่อง`}
                                </p>
                            </div>
                            <div class="p-4 space-y-3 max-h-96 overflow-y-auto">
                                ${tasksInMonth.length === 0 ? `
                                    <div class="text-center py-8 text-gray-400">
                                        <svg class="w-12 h-12 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
                                        </svg>
                                        <p class="text-sm">ไม่มีงานในเดือนนี้</p>
                                    </div>
                                ` : tasksInMonth.map(item => renderTaskCard(item, item.taskType)).join('')}
                            </div>
                        </div>
                    `;
                }).join('')}
                </div>
            `;
        }

        
        function renderTaskCard(item, type) {
            const taskId = `${item.id}`;
            const { startDate, endDate } = calculateActualDates(
                item.month,
                item.year,
                item.startWeek,
                item.durationWeeks
            );
            const status = getTaskStatus(taskId, startDate, endDate);
            const taskProgress = progress[taskId] || { progress: 0 };
            const statusColor = getStatusColor(status);
            
            // ใช้สีตามฝ่าย

            // กำหนดสี border แบบตรงๆ

            const typeIndicator = type === 'ongoing' ? 
                '<span class="text-xs text-gray-700 bg-gray-200 px-2 py-0.5 rounded font-semibold">Cont</span>' : 
                '<span class="text-xs text-green-700 bg-green-100 px-2 py-0.5 rounded font-semibold">New</span>';

            return `
                <div class="task-card border-l-4 pl-3 py-2 ${deptBgLight} rounded cursor-pointer hover:shadow-md transition-all"
                    style="border-left-color: ${borderColor};"
                    onclick='openProgressModal(${JSON.stringify(item).replace(/'/g, "&#39;")}, "${taskId}")'>
                    <div class="flex items-center justify-between mb-1">
                        <div class="flex items-center gap-1">
                            ${typeIndicator}
                            <span class="px-2 py-0.5 rounded-full text-xs font-semibold text-white ${statusColor}">
                                ${getStatusText(status)}
                            </span>
                        </div>
                        <span class="text-xs font-semibold text-gray-600">${taskProgress.progress}%</span>
                    </div>
                    <div class="text-xs ${deptText} font-medium mb-1">
                        ${item.department.replace('ฝ่าย', '').replace(/\s*\(.*?\)\s*/g, '').trim()}
                    </div>
                    <div class="text-xs text-gray-600 mb-1">

                                        class="px-4 py-2 rounded-md flex items-center gap-2 transition-all ${view === 'timeline' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-600 hover:bg-gray-100'}">

                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                                        </svg>
                                        Timeline
                                    </button>
                                    <button onclick="view = 'calendar'; render();"
                                        class="px-4 py-2 rounded-md flex items-center gap-2 transition-all ${view === 'calendar' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-600 hover:bg-gray-100'}">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                        </svg>
                                        ปฏิทิน
                                    </button>
                                    <button onclick="view = 'report'; urgentTasksPage = 1; render();"
                                        class="px-4 py-2 rounded-md flex items-center gap-2 transition-all ${view === 'report' ? 'bg-blue-600 text-white shadow-md' : 'text-gray-600 hover:bg-gray-100'}">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                                        </svg>
                                        รายงาน
                                    </button>
                                </div>
                            </div>

                            <div class="text-sm text-gray-600">
                                แสดง <span class="font-semibold text-blue-600">${filteredData.length}</span> จาก <span class="font-semibold">${data.length}</span> รายการ
                            </div>
                        </div>

                        <!-- Content -->
                        <div class="p-6">
                            ${view === 'table' ? renderTableView(filteredData) : 
                              view === 'timeline' ? renderTimelineView(filteredData) : 
                              view === 'report' ? renderReportView(filteredData) :
                              renderCalendarView(filteredData)}
                        </div>
                    </div>
                </div>

                ${renderProgressModal()}
            `;
        }

        render();
    </script>
</body>
</html>
